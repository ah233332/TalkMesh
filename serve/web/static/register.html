<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkMesh 注册</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>注册 TalkMesh</h1>
    <form method="post" action="/register">
      <input name="userId" placeholder="用户ID（数字）" autocomplete="off">
      <input name="userName" placeholder="用户名" autocomplete="off">
      <input name="userPwd" type="password" placeholder="密码">
      <button>注册</button>
    </form>
    <p class="muted"><a href="/">已有账号？去登录</a></p>
  </main>
</body>
</html>
